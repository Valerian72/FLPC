 const cnt={};if(VM=='s')cnt[seas(today())]=0;if(VM=='t')Object.values(C.teams).forEach(t=>{cnt[t.name]=0});L.forEach(m=>{const k=VM=='s'?seas(m.date):VM=='m'?m.date.slice(0,7):VM=='t'?(solo(m)?'':(m.opp||'').trim()):m.date.slice(0,4);if(k)cnt[k]=(cnt[k]||0)+1});

function mlist(){const sh=(C.config.hist||{}).all,cur=seas(today()),td=today(),f=VW.k,A=Object.values(C.matches).filter(m=>f=='a'||(f=='s'&&!VW.v&&sh)||(f=='s'?seas(m.date)==(VW.v||cur):f=='m'?m.date.slice(0,7)==VW.v:f=='t'?!solo(m)&&(m.opp||'').trim().toLowerCase()==(VW.v||'').toLowerCase():m.date.slice(0,4)==VW.v)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))),
 S=wkS(A,td),
 lab=f=='a'||(f=='s'&&!VW.v&&sh)?'Tous les matchs':f=='m'?mlab(VW.v):f=='y'?'Année '+VW.v:f=='t'?'Équipe : '+VW.v:'Saison '+(VW.v||cur);
 return (!mFiltOn()?'':`<div style="position:relative;margin:6px 0"><button onclick="VO=!VO;render()" style="font-weight:700">${lab} ▾</button>${VO?`<div class="c" style="position:absolute;z-index:6;top:100%;left:0;width:min(290px,92vw);padding:10px;box-shadow:0 8px 24px #0004"><div class="r" style="margin:8px 0">${[['s','Saison'],['m','Mois'],['y','Année'],['t','Équipe']].map(([k,l])=>`<button class="${VM==k?'on':''}" onclick="VM='${k}';VQ='';render()">${l}</button>`).join('')}</div><div id="vres" style="max-height:210px;overflow:auto">${vres()}</div></div>`:''}</div>`)+S.map(([t,l],i)=>i==0&&!l.length?'':`<details ${(OP[i]??1)?'open':''} ontoggle="OP[${i}]=this.open"><summary style="font-size:.8rem;font-weight:600;opacity:.85;padding:10px 4px;cursor:pointer">${t} (${l.length})</summary>${l.map(mrow).join('')||'<p class="mu">'+['Pas de match aujourd’hui','Pas de match prévu cette semaine','Aucun match.'][i]+'</p>'}</details>`).join('')}
const CNM={matches:'le match',teams:"l'équipe",meals:'le repas',players:'le joueur',collectes:'la collecte',depenses:'la dépense',roles:'le rôle',config:'le réglage'},LOGC=Object.keys(CNM);

const VERS=[['3.66','Score du match : tuile unique, titre pour déplier',['La ligne « Buteurs, passeurs, CSC » est supprimée : il ne reste que la tuile Score du match.','Un appui sur le titre (flèche ›) déplie la tuile : buteurs, passeurs, CSC adverse, buts de l’adversaire (case CSC) et mi-temps. Replié, il indique le nombre de buteurs à renseigner.','La ligne du score (− / +) et le bouton Match terminé restent toujours visibles.']],['3.65','Tuile Score du match : ligne du score toujours visible, équipes dépliables',['La tuile Score du match n’est plus repliée en entier : la ligne avec le score et les − / + reste toujours visible.','Le dépliage (flèche ›) ouvre le choix des deux équipes : buteurs et passeurs de FLPC, CSC adverse, buts de l’adversaire (case CSC) et mi-temps.','Les tuiles Résumé du match et Stats du match restent réduites.']],['3.64','Onglet Stats du match : tuiles réduites',['Toutes les tuiles de l’onglet Stats (Score du match, Résumé du match, Stats du match) sont réduites à une ligne avec leur titre et un résumé (score, nombre d’actions ou de buts) ; un appui sur la ligne déplie la tuile.','Seule exception : la saisie du score reste dépliée tant que le match n’est pas terminé, pour saisir directement après le match.','L’état ouvert / fermé est mémorisé pendant la session.']],['3.63','Stats : saisie en ligne réduite, CSC adverse à cocher, tuile Stats du match mise à jour',['Saisie du score : une seule ligne avec le score et les − / + ; les buteurs, passeurs et CSC se déplient d’un appui (ils s’ouvrent aussi tout seuls quand on ajoute un but à FLPC).','Buts de l’adversaire : plus de liste déroulante, chaque but arrive avec une case « CSC » à cocher (but contre son camp de FLPC).','Tuile « Stats du match » : affiche le score (avec la mi-temps), puis chaque but de FLPC avec son buteur et son passeur, les CSC adverses, et les buts de l’adversaire (CSC de FLPC signalés).']],['3.62','Stats du match : saisie directe du score et des buts, sans fenêtre',['Onglet Stats (admins) : le score, les buteurs et les passeurs se saisissent directement dans la page, plus de fenêtre ni d’étapes.','Score : − et + de chaque côté. Chaque but de FLPC ajoute une ligne avec deux listes : buteur et passeur (« Sans passeur » possible).','CSC : le choix « CSC adverse » est dans la liste des buteurs (but contre son camp de l’adversaire). Pour l’adversaire, chaque but peut être « But adverse » ou « CSC de FLPC ».','La saisie est gardée automatiquement en brouillon ; le bouton « Match terminé » enregistre le score et clôt le match (« Enregistrer » pour corriger un match déjà terminé).','La fenêtre « Match terminé » de 22 h 30 ouvre maintenant directement cette page.']],['3.61','Page match : barre du bas masquée',['Sur la page d’un match (à venir, en cours ou terminé), la barre du bas (Matchs, Stats, Admin…) disparaît pour laisser toute la place au match. La flèche de retour en haut ramène à la liste des matchs, où la barre réapparaît.','L’espace vide qu’elle laissait en bas de page est réduit.']],['3.60','Fenêtre de fin de match : bouton « Rappeler plus tard »',['Dans la fenêtre « Match terminé », le bouton de report s’appelle maintenant « Rappeler plus tard » (le rappel reste actif toutes les 5 minutes tant que le score n’est pas saisi).']],['3.59','Fenêtre de fin de match à 22 h 30, rappel toutes les 5 minutes',['La fenêtre « Match terminé » s’affiche à 22 h 30 le soir du match (plus tard si l’heure de fin saisie dépasse 22 h 30), pour les admins.','Tant que le score n’est pas saisi, elle revient toutes les 5 minutes (bouton « Me le rappeler dans 5 min »), y compris si on la ferme avec la croix.','Elle s’arrête dès que le score est enregistré. Un match non saisi depuis plus de 7 jours ne relance plus de fenêtre.']],['3.58','Match terminé : fenêtre pour saisir le score, tuile « Match non enregistré » retirée',['La tuile « Match non enregistré » n’apparaît plus sur la page du match (admins).','Nouveau : quand un match est réellement terminé (heure de fin saisie, sinon coup d’envoi + 1 h 30), une fenêtre propose aux admins de saisir le score et les buteurs tout de suite, ou de le faire plus tard.','La fenêtre ne s’affiche qu’une fois par match sur l’appareil, pour les matchs terminés depuis moins de 7 jours et non enregistrés.']],['3.57','Match › Infos : météo en résumé, détail au clic',['Tuile Météo plus compacte : icône, description, heure et température sur une seule ligne.','Un clic sur la tuile déroule le détail (ressenti, nuages, pluie, vent et conseil) ; un second clic le referme.']],['3.56','Match › Infos : tuile météo enrichie (résumé, ressenti, nuages, pluie, vent, conseil)',['Tuile Météo : icône météo et description à gauche, température en grand à droite.','Puces : ressenti, nuages, pluie (en % pour un match à venir, en mm pour un match passé) et vent.','Ligne de conseil adaptée aux prévisions (veste de pluie, froid, chaleur, vent, orage), pour les matchs à venir.']],['3.55','Match › Infos : Terrain remonté au-dessus de Lieu',['Ordre des tuiles : Prévision météo, Terrain, puis Lieu.']],['3.54','Match › Infos : Météo, Lieu et Terrain en tuiles pleine largeur',['Ordre des tuiles : Prévision météo, puis Lieu, puis Terrain.','La météo et le Lieu passent sur une tuile pleine largeur, comme Terrain ; la météo affiche l’heure, la pluie et le vent à gauche, l’icône et la température à droite.']],['3.53','Météo des matchs terminés + onglet Météo dans Stats',['La tuile météo reste affichée pour les matchs terminés : météo observée à l’heure du match (icône, température, pluie en mm, vent).','L’heure du match est indiquée sur la tuile (« À 15h30 »).','La météo d’un match terminé est enregistrée dans le match pour les statistiques ; elle est effacée si la date, l’heure ou la ville du match changent.','Stats : nouvel onglet « Météo » à activer / désactiver (bouton en bas de la page Stats, réservé à ceux qui gèrent les stats) : résultats selon le temps (beau temps, couvert, pluie / neige) et selon la température, liste match par match.']],['3.52','Match › Infos : tuile Prévision météo à droite du Lieu',['Nouvelle tuile « Prévision météo » à droite de Lieu, de la même taille que Rendez-vous et Coup d’envoi.','Elle donne le temps prévu à l’heure du coup d’envoi : icône, température, risque de pluie et vent (données Open-Meteo), pour un match dans les 15 prochains jours.','Au-delà de 15 jours, elle indique « Disponible 15 jours avant » ; elle n’apparaît pas pour un match passé.','La ville vient du champ Ville du match (ou de la position GPS de l’équipe adverse).']],['3.51','Match : icône Infos en « i » seul, taille des autres icônes',['Icône Infos : le « i » italique est seul, sans le rond autour, à la même taille que les autres icônes.']],['3.50','Match : icône Infos en « i » italique, icônes sans voile vert',['Icône Infos : un « i » italique à empattement dans un rond, comme le modèle fourni.','Icônes d’onglets : plus de voile vert sur l’icône sélectionnée ; à la place, une ombre plus marquée autour du rond (comme le bas des tuiles).']],['3.49','Match : icône Infos, Notes après match, Lieu avec ville, sélecteur d’heure',['Icône Infos : un « i » classique (rond plein, i en creux).','Onglet Notes : n’apparaît que lorsque le match est terminé.','Onglet Infos : le Terrain est au-dessus du Lieu ; l’heure du Rendez-vous est en vert comme les présents.','Lieu : affiche la ville puis le nom du stade et l’adresse. Le lieu du RDV (doublon) n’est plus affiché.','Créer / Modifier le match › Infos : « Lieu du match » devient deux champs, Ville puis Nom du stade et adresse.','Créer / Modifier le match › Horaires : « Lieu du RDV » retiré ; ordre Heure du RDV, Heure du match, Fin ; chaque heure se règle avec des flèches haut / bas (heures, et minutes par pas de 5).']],['3.48','Page match : icônes d’onglets sans contour, icône Infos « i », étoile Notes jaune',['Onglets du match : le contour des ronds est supprimé, remplacé par une légère ombre (comme les bulles Infos).','Icône Infos : un « i » dans un rond à la place du calendrier.','Icône Notes : étoile jaune.']],['3.47','Page match : bulles Infos avec ombre légère à la place du liseré',['Onglet Infos : le liseré de couleur est supprimé, les bulles ont à la place une ombre légère sous le bord inférieur.']],['3.46','Page match : bulles Infos plus basses, liseré en bas, version masquée',['Onglet Infos : les bulles Rendez-vous et Coup d’envoi ont la même hauteur que la bulle Participants.','Le liseré de couleur n’est plus à gauche des bulles : il passe en dessous, de la couleur des icônes d’onglets (vert).','La version de l’appli n’apparaît plus dans les fenêtres (profil, bas de page) : elle reste affichée uniquement en bas à droite, dans la barre Matchs, Stats, etc.']],['3.45','Page match : l’onglet Votes devient Notes',['Page match : l’onglet « Votes » est renommé « Notes » (même contenu : terrain, douches, repas, esprit loisir, homme du match).']],['3.44','Page match : icônes monochromes, cases Rendez-vous / Coup d’envoi plus basses',['Onglets du match : les icônes Infos, Présences, Compo, Stats et Votes passent en icônes simples d’une seule couleur (gris, vert quand l’onglet est actif) au lieu des emojis colorés. Direct garde son rond rouge.','Cases Rendez-vous et Coup d’envoi : hauteur très légèrement réduite (environ 10 %).']],['3.43','Match : ligne de version retirée sous la liste',['Onglet Matchs : la ligne « Foot Loisir · v… » sous les matchs est supprimée. La version reste affichée en bas à droite, dans la barre avec les boutons Matchs, Stats, etc.']],['3.42','Filtre Saison / recherche masqué dans Matchs, option admin',['Onglet Matchs : le bouton Saison (filtre et recherche) n’apparaît plus pour personne par défaut.','Nouvelle option pour les admins : Admin › Matchs › Historique › « Afficher le filtre Saison et la recherche dans l’onglet Matchs ». Une fois activée, le bouton revient pour tout le monde.','Quand le filtre est masqué, l’affichage repasse sur la saison en cours (tous les matchs de la saison si l’option historique est cochée).']],['3.41','Match mobile : liste collée sous Saison, match terminé bien visible',['Plus de barre « Terminés » collée en haut : les matchs ne glissent plus dessous (c’était ce qui donnait l’impression d’un match coupé).','La liste commence directement sous le bouton Saison, sans espace, et le haut reste opaque.','À l’ouverture, le dernier match terminé s’affiche en entier avec son titre « Terminés », puis « À venir » et le match.','La mise en page se recale toute seule (rotation, changement de taille, chargement de la police).']],['3.40','Match mobile : en-tête fixe, seuls les matchs défilent',['Mobile : la barre du haut (FLPC, profil du joueur, réglages admin) et le filtre Saison restent en place, seule la liste des matchs défile.','À l’ouverture : le match en cours ou à venir apparaît directement, avec le dernier match terminé juste au-dessus. S’il n’y a pas de match à venir, les deux derniers matchs terminés s’affichent.','On remonte pour retrouver les anciens matchs, qui se chargent automatiquement (10 par 10). Titres Terminés / À venir fixés en haut de la liste pendant le défilement.','Sur ordinateur et avec un filtre (mois, année, équipe, ancienne saison) : affichage inchangé.']],['3.39','Correctif : la liste Match mobile (v3.35 à v3.38) ne s’activait pas',['Correction d’un conflit de nom interne qui empêchait tout le bloc d’être exécuté : la liste Match restait à l’ancien affichage (À venir puis Terminés en dessous).','Mobile : terminés au-dessus, match en cours ou à venir au milieu, on remonte pour les anciens matchs (10 de plus se chargent en haut), maintenant réellement actif.','Test de la liste avec 19 matchs en largeur téléphone : ordre, matchs à venir et chargement des anciens vérifiés.']],['3.38','Match mobile : centrage fiable, qualité du terrain alignée',['Mobile : la liste Match se centre bien sur le match en cours ou à venir, même quand les données arrivent après l’ouverture de l’appli (avant, elle pouvait rester tout en haut sur les plus anciens).','Page match › Infos : « Qualité du terrain » est aligné à gauche, au début de la première étoile.']],['3.37','Match mobile : liste façon SportEasy, on remonte pour les anciens matchs',['Mobile : les matchs terminés sont au-dessus du match en cours ou à venir, et l’écran s’ouvre centré sur ce dernier.','Les anciens matchs sont déjà dans la liste au-dessus : on remonte simplement pour les voir (10 matchs terminés chargés d’avance).','En approchant du haut, 10 matchs plus anciens se chargent automatiquement, sans que la page saute.','Un espace est ajouté sous le dernier match pour que le match à venir reste bien au milieu de l’écran.']],['3.36','Match mobile : chargement automatique au scroll',['Mobile : en remontant la liste Match tout en haut (glisser vers le bas), les 5 matchs terminés précédents se chargent tout seuls, sans que la page saute.','Admins : en arrivant tout en bas, les 5 matchs suivants se chargent automatiquement.','Les boutons « Matchs précédents » et « Matchs suivants » restent disponibles.']],['3.35','Match sur mobile : fenêtre glissante façon SportEasy',['Mobile : la liste Match n’affiche plus que les 2 derniers matchs terminés au-dessus, et le match en cours ou à venir au milieu de l’écran.','Bouton « Matchs précédents » en haut pour remonter dans les matchs terminés (5 de plus à chaque fois, sans que la page saute).','Admins : bouton « Matchs suivants » en bas pour voir les prochains matchs.','Ordre chronologique : le plus ancien en haut, le plus récent en bas.','Ordinateur et filtres (mois, année, équipe, ancienne saison) : affichage inchangé.']],['3.34','Direct masqué avant le match',['Page match : le bouton Direct n’apparaît que le jour du match, à partir de 1 h avant le coup d’envoi (et reste visible ensuite).']],['3.33','Type de match à gauche, plus petit',['En-tête du match : le type de match (Match amical, Championnat loisir…) repasse à gauche après VS, en plus petit.']],['3.32','Page match : onglets ronds, terrain, en-tête et Infos revus',['Onglets du match : 6 boutons ronds avec icône (🗓️ 👥 🎽 📈 ⭐ 🔴) et nom dessous, couleurs conservées.','En-tête : le type de match (Match amical, Championnat loisir…) est centré sur la ligne VS entre les deux équipes (VS reste à gauche), sans icône ; le compte à rebours est centré verticalement.','Infos : Participants en haut sur une ligne (présents en vert, en attente en orange, absents en gris, non cliquable), puis Rendez-vous et Coup d’envoi côte à côte, Lieu, Terrain et Itinéraire. Rendez-vous aussi visible sur un match terminé.','Nouveau : type de terrain (Herbe, Synthétique, Stabilisé) et qualité de 1 à 3 étoiles (Mauvais, Correct, Excellent) à renseigner à la création ou modification du match, affichés entre Lieu et Itinéraire.','Liste des matchs : la rubrique En cours n’apparaît que le jour d’un match ; les boutons Reporté / Annulé sont retirés des cartes (ils restent dans l’engrenage du match).']],['3.31','Couleurs plus discrètes : liseré coloré à gauche',['Onglets du match et tuiles de l’onglet Infos : fond neutre avec un liseré coloré de 4 px à gauche (vert, bleu, orange, violet, jaune, rouge selon la section).','L’onglet actif est teinté de sa couleur avec le texte coloré.']],['3.30','Non retenus replié, réponse de présence simplifiée',['Onglet Présences : la liste des non retenus est repliée aussi pour un match à venir.','Page match : une fois la réponse donnée, seul le bouton Présent ✓ ou Absent ✓ reste affiché. Les deux boutons côte à côte restent tant qu’il n’y a pas de réponse.']],['3.29','Onglets du match plus compacts sur une ligne',['Les 6 onglets (Infos, Présences, Compo, Stats, Votes, Direct) repassent sur une seule ligne, tuiles plus petites en gardant leurs couleurs.','Petit point rouge sur Direct quand le match est en cours.']],['3.28','Page match : onglets en grosses tuiles colorées, infos en tuiles, compte à rebours',['Onglets du match en grille 3 par 2 : Infos (vert), Présences (bleu), Compo (orange), Stats (violet), Votes (jaune), Direct (rouge), avec une petite info sous chaque nom.','Onglet Infos : rendez-vous, coup d’envoi, participants, type et lieu en tuiles colorées, gros bouton Itinéraire. Toucher Participants ouvre les présences.','Compte à rebours en haut à droite du match (J-2, puis heures et minutes le jour J, En cours pendant le match).','Présent et Absent toujours affichés côte à côte, le choix actuel en couleur pleine.']],['3.27','Actions sur le match en tuiles',['Fenêtre Actions sur le match : quatre grandes tuiles (Modifier, Reporté, Annulé, Supprimer) avec icône.','Modifier en vert plein, Reporté en orange, Annulé en gris, Supprimer en rouge, en teintes douces comme les pastilles de l’appli.','L’adversaire et la date du match sont rappelés sous le titre.']],['3.26','Fenêtre Modifier le match en 3 onglets',['Modifier le match : Infos, Horaires et Résultat en 3 onglets, un sujet à la fois.','Champs plus grands avec leur nom au-dessus (adversaire, date, journée, type, lieu, domicile / extérieur, remarque, heures, RDV).','Résultat : match joué Non / Oui, score, CSC adverse, puis une carte par joueur (présent, buts, passes, CSC, homme du match) avec de grands boutons − et +.','Bouton Enregistrer toujours visible en bas de la fenêtre.']],['3.25','Onglets du match sans icônes',['Page match : les onglets Infos, Présences, Compo, Stats, Votes et Direct n’affichent plus que le texte, toujours sur une seule ligne.','Texte des onglets un peu plus grand, zone tactile de 48 px de haut.']],['3.24','Plein écran mobile, onglets du match plus faciles à toucher',['Mode plein écran sur iOS et Android : installe l’appli sur l’écran d’accueil et elle s’ouvre sans barre du navigateur (icône, manifeste et barre d’état adaptés, zones sûres respectées).','Bandeau d’aide (une seule fois) : bouton Installer sur Android, explication Partager › Sur l’écran d’accueil sur iPhone / iPad.','Page match : les 6 onglets (Infos, Présences, Compo, Stats, Votes, Direct) tiennent sur une seule ligne, regroupés dans une barre arrondie et espacés pour être faciles à toucher.','Ergonomie tactile : plus de zoom au double appui, pas de rafraîchissement accidentel en tirant vers le bas.']],['3.23','Stats mobile, mi-temps dans le résumé, onglets agrandis',['Stats du match : une ligne par but avec icône ballon (buteur, à gauche) et icône pied (passeur, en face), minute à gauche, adaptée au mobile.','Tableau joueur / buts / passes retiré des Stats.','Score de la mi-temps affiché dans la frise du résumé (calculé depuis le direct si non saisi, modifiable par le coach).','Onglets de la page match plus grands.','Présences d’un match terminé : Non retenus repliés.']],['3.22','Stats en tableau, résumé en frise, nouvelles icônes',['Stats du match en tableau : minute, buteur et passeur en face (si le direct est enregistré), sinon joueur / buts / passes.','Résumé du match en frise chronologique (Stats) : cartes But !, Égalisation !, But adverse, Arrêt… avec le score et le passeur.','Icône de passe décisive : pied avec ballon. Icônes de ballon en noir et blanc.','Engrenage de la page match en gris et plus petit.']],['3.21','Match : à venir, note, fenêtre but',['Liste Match : En cours (jour du match), À venir (semaine), Terminés.','Match terminé, Infos : Note du match en premier (Noter le match / Ne pas noter), Participants tout en bas, plus de résumé ni de rendez-vous.','Onglets de la page match ajustés pour tenir sur une ligne en mobile, cartes Participants / Rendez-vous / Match plus compactes.','Ligne « Match enregistré » et carte Votes en doublon retirées de Infos.','Stats : ligne Notes des joueurs retirée ; résumé du match déroulé quand le direct est enregistré.','Score : « But contre son camp pour FLPC » ; le + d’un but FLPC ouvre une fenêtre buteur / passeur.']],['3.20','Stats, Votes et synthèse du match',['Onglets : Infos, Présences, Compo, Stats, Votes, Direct.','Fenêtre Score au même style que les autres fenêtres, avec mi-temps, CSC adverse, CSC de notre équipe, buteurs et passeurs.','Le match ne s’enregistre plus que par Stats › Score (boutons Enregistrer / Modifier retirés de la page du match).','Infos : synthèse (score, buteurs, passeurs, météo) et note du match une fois le match enregistré.','Nouvel onglet Votes : terrain, douches, repas, esprit loisir, homme du match et note des joueurs.']],['3.18','Direct : momentum, phrases drôles, météo, FLPC',['Ligne Début / Mi-temps / Fin transformée en graphique de momentum : actions de FLPC au-dessus, de l’adversaire en dessous.','Phrases drôles entre les actions et sous chaque action.','Météo du lieu du match (équipe citée en premier = à domicile) prise en compte dans les phrases.','« nous » remplacé par FLPC.']],['3.17','Direct : icônes réduites, équipe adverse, moment en haut',['Icônes du direct plus petites.','Corner et coup franc de l’adversaire : nom de l’équipe affiché à la place de « pour l’autre ».','En haut : minute de jeu, buteurs avec leur minute sous chaque équipe, dernière action.','Heure de saisie indiquée sur chaque action de la chronologie.']],['3.16','Direct en pleine page, chronologie, icônes foot',['Onglet Direct en pleine page : score, noms des équipes et badge LIVE restent en haut, flèche pour revenir.','Chronologie : début du match, actions avec leur minute, mi-temps, fin du match, et frise de progression.','Icônes dessinées thème football pour toutes les actions (ballon, but, gant, crampon, corner, mur…).']],['3.15','Direct : ajout rapide et barre d’actions',['Corners, coups francs et but adverse : un seul tap, avec message Annuler pendant 5 secondes.','Minute estimée automatiquement depuis l’heure de début (pause de 15 min après 45\').','But, passe décisive, arrêt, action top : touche la photo du joueur pour valider.','Score toujours visible en haut, boutons d’actions collés en bas de l’écran.','Compteur sur chaque bouton d’action.','Petite vibration à chaque ajout.']],['3.14','Direct : score centré, corners, coups francs, modification',['Match du jour : le badge LIVE rouge revient sur la ligne du match.','Onglet Direct : score centré au milieu, badge LIVE centré.','Cartons jaune et rouge retirés.','Nouvelles actions : corner et coup franc pour nous / pour l’autre.','Actions du match : bouton ✏️ pour corriger une action (type, joueur, minute).']],['3.13','Match : En attente dans Infos, heure sous la date',['Onglet Infos : Participants affiche aussi « En attente ».','Page match : l’heure du match sous la date.','Indication « En cours » retirée des lignes de match.']],['3.12','Présences : En attente, fenêtre centrée',['Onglet Présences : nouvelle liste « En attente » entre Présents et Absents.','Fenêtre « Sélectionner un type de présence » recentrée au milieu de l’écran.']],['3.11','Présences : Non retenus, postes, fiche joueur',['Onglet Présences : nouvelle liste « Non retenus » (joueurs sans réponse Présent / Absent).','Le poste du joueur s’affiche sous son nom.','Coachs et admins : trois points à droite de chaque joueur pour ouvrir sa fiche et choisir son type de présence (Présent, En attente, Absent, Non retenu).']],['3.10','Page match : Présences épurées, en-tête masqué',['Onglet Présences : titres sans icône et plus petits.','Page match : la ligne avec le logo FLPC et le profil est masquée.']],['3.9','Page match refaite',['Page d’un match : date en en-tête, équipes avec VS, gros bouton Présent / Absent, onglets Infos / Présences / Compo / Direct.','Onglet Infos : Participants (présents / absents), Rendez-vous, Match (type, début, fin, adresse, itinéraire).']],['3.8','Match : présence absent, titres',['Quand tu es absent, le bouton Présent disparaît et un clic sur Absent ouvre « Modifier ma présence ? » (Je serai présent / Annuler).','Titres « En cours » et « Terminés » plus petits et sans icône.']],['3.7','Match : En cours seul, présence, tri des terminés',['Match : la section « À venir » n’est plus affichée, seul le match en cours apparaît.','Quand tu es présent, le bouton Absent disparaît du match en cours.','Clic sur Présent (déjà présent) : fenêtre « Modifier ma présence ? » avec « Je serai absent » et « Annuler ».','Matchs terminés classés du plus récent au plus ancien.']],['3.6','Correctif : affichage au démarrage',['Correction du plantage (page blanche) quand on est déjà connecté à l’ouverture de l’appli.']],['3.5','Match : En cours = match de la semaine, À venir = match suivant',['Match : « En cours » affiche le match de la semaine (jusqu’au dimanche) avec le badge 🔴 En cours ; sinon « Pas de match cette semaine ».','Match : « À venir » ne montre que le match suivant (les admins voient tous les matchs à venir).','Match à venir : plus de choix Présent / Absent dans la liste.']],['3.3','Profil en plein écran, matchs à venir limités, version affichée',['Match : les joueurs ne voient plus que le match de la semaine en cours et le suivant (les admins voient tout).','Profil : simple icône (l’avatar choisi) tout à droite de l’en-tête, fenêtre plein écran.','Profil : Mon compte puis Informations personnelles (Mes informations, Mon profil équipe).','Déconnexion déplacée tout en bas du profil, avec confirmation.','Version de l’appli affichée en bas des pages et du profil.']],['3.2','Comptes, rôles, calendrier 2026-27',['Rôle Dieu renommé Super Admin (👑) dans toute l’interface.','Gestion des comptes : cartes compactes, recherche, Outils avancés repliables (corbeille, historique des accès, sécurité des codes).','Gestion des rôles : une carte par rôle, droits par catégories avec interrupteurs ; nouveau rôle Joueur / Coach.','Admin réorganisé : Matchs, Club, Finances, Système.','Import du calendrier 2026-27 : matchs, repas et cuistots, résultats, stades et horaires.','Calendrier des matchs (admin) : grille en lecture seule et tableau simplifié avec ✏️.']],['3.1','Hébergement GitHub + Firebase, correction du code',['Site hébergé sur GitHub Pages, données partagées via Firebase.','Correction : le changement du code Super Admin (et des codes joueurs) fonctionne à nouveau.']],['2.9','Buvette, GPS en icônes, profil harmonisé, avatars',['Admin : Buvette, prix des consommations.','Itinéraires : trois icônes de même taille (Google Maps, Waze, Plans).','Onglets du match sans icônes, point rouge conservé pour le Direct.','Fenêtre de profil à taille fixe, onglet Compte supprimé : Onglet Information (licence, cotisation, mot de passe), onglet Santé supprimé, âge à côté de la date de naissance ; Déconnexion plus petite avec confirmation.','Photo de profil : choix parmi des avatars dessinés, prise de photo ou import.']],['2.8','Scores en couleur, buteurs et passeurs choisis dans une liste',['Score des matchs coloré : vert gagné, jaune nul, rouge perdu.','Saisie du score : pour chaque but, choix du buteur et du passeur dans une liste de joueurs.']],['2.7','Admin réorganisé, équipes adverses en tableau',['Plus de rouge, jaune et vert sur les lignes de match.','Admin : Paiements, Infos de l équipe, Paramètres d événements.','Gestion équipe adverse : tableau des équipes avec adresse, GPS et modification.','Page Détails de l équipe et page Vote et notes du match.']],['2.6','Infos, direct (LIVE) et statut à droite',['Couleur du résultat sur le bord droit de la ligne de match, couleur du type sur le bord gauche.','Onglet Infos : participants, rendez-vous, type, début, fin et adresse.','Onglet Direct : actions du match notées en direct par les joueurs présents, partage WhatsApp, pastille LIVE rouge.','Le direct alimente automatiquement l assistant d enregistrement du match.']],['2.5','Onglet Admin, lignes de match colorées par résultat',['Onglet Admin en bas à droite pour les comptes Admin et Super Admin : matchs, équipe, notes par match, accès et droits, mises à jour.','Options réduit à Mon compte pour les admins.','Lignes de match : bordure rouge perdu, verte gagné, jaune nul, liseré supplémentaire pour amical ou championnat.','Stats du match et onglet Infos masqués tant que le match n est pas enregistré.','Notes déplacées dans Admin, rangées par match.']],['2.4','Profil en fenêtre, assistant de fin de match, onglet Notes admin',['Profil joueur en fenêtre centrée avec croix style iOS et onglet Compte.','Textes à côté des icônes licence et cotisation repas.','Assistant pas à pas pour enregistrer le match : score, joueurs validés, actions, récapitulatif.','Indication Match non enregistré pour les admins.','Onglet Notes (admin) : toutes les notes, modification et réinitialisation.']],['2.3','Notes inspirées de l appli de référence',['Homme du match et Note des joueurs : seulement les joueurs indiqués présents, avec photo et curseurs colorés.','Note du match juste sous les onglets, puis qualité du terrain, qualité des douches, repas et esprit loisir.']],['2.2','Membres, identité, santé et infos sportives',['Effectif devient Membres, avec le même affichage pour les joueurs et les admins.','Un admin ajoute ou modifie un membre depuis le bouton Ajouter / Modifier.','Menu joueur en trois onglets : Identité, Santé, Infos sportives.','Icônes licence validée et cotisation repas payée ou non.','Deux choix de poste, rôle, numéro de maillot, numéro de licence, année d arrivée.']],['2.1','Effectif : poste et statut',['Bouton … (paramètres d événement) retiré de l en-tête.','Effectif : un admin définit le poste de chaque joueur (gardien, arrière latéral, défenseur central, milieu, ailier, avant-centre…).','Statut du joueur : licencié ou occasionnel, avec le décompte en bas de page.']],['2.0','Infos en tuiles et nouvelles notes',['Note du match et Homme du match côte à côte.','Note des joueurs avec un curseur de 0 à 10 par joueur et un seul bouton Valider / Modifier.','Nouvelles notes en étoiles : terrain, douches, repas et esprit loisir de l équipe adverse.']],['1.9','Onglet Infos remis',['Onglet Infos dans le détail du match : note du match, homme du match et note des joueurs.']],['1.8','Page match allégée',['Version de l appli affichée en bas à droite.','Date et score identiques à la liste des matchs, stats du match juste dessous.','Onglet Infos supprimé : son contenu est directement sur la page.','Présence : seulement les joueurs présents et absents.','Note des joueurs : tous les joueurs avec leur photo.']],['1.7','Page match simplifiée',['Équipes l un sur l autre avec le score, sans bandeau bleu.','Onglets Infos, Présence et Compo sous le score ; les stats du match sont dans Infos.','Note du match en étoiles avec validation, retrait et nouveau vote.','Homme du match : liste des joueurs cliquable avec buts, passes décisives et poste.','Boutons GPS cachés quand le match est terminé.']],['1.6','Page match détaillée, accès et profil',['Page de garde quand on est déconnecté : rien n est visible avant la connexion.','Codes provisoires créés par le Super Admin uniquement, avec demande de code depuis la page de garde.','Profil : clic sur le nom en haut, informations personnelles, gestion de compte.','Page match : en-tête avec date, type et RDV, score avec heure, buteurs, score mi-temps, adresse avec itinéraire, homme du match, note du match en étoiles et note des joueurs.']],['1.5','Matchs plus lisibles, recherche, journal',['Chaque match affiche les deux clubs l\'un au-dessus de l\'autre (celui qui reçoit en haut), avec leur logo.','Le type (amical, championnat + journée) est indiqué au-dessus et le match a une couleur selon son type.','Score centré à droite : vert si gagné, rouge si perdu, jaune si nul.','« En cours » n\'apparaît que le jour du match.','Touche « Saison … » pour filtrer par saison, mois ou année, ou chercher un match.','Cette page : versions et journal des modifications.']],['1.4','Logo, événements, historique',['Logo et nom du club modifiables par un admin (touche le logo en haut).','Bouton + : choix du type d\'événement (entraînement, amical, championnat, coupe, tournoi…).','Bouton … : activer/désactiver la gestion des présences et la liste d\'attente.','Options › Historique des matchs, avec case pour tout afficher dans Matchs.']],['1.3','Gestion matchs et équipes',['Options › Gestion matchs : créer un match, gérer les équipes.','Fiche équipe : adresse du stade et GPS, avec liens Google Maps, Waze et Plans.','Les fenêtres s\'affichent au centre de l\'écran.']],['1.2','Calendriers et page match',['Calendriers des matchs et des repas par saison, dans Options.','Page de chaque match : Infos, Présence, Compo, Stats (score, actions, notes).']],['1.1','Comptes et droits',['Connexion par nom et code à 4 chiffres, codes provisoires.','Trois niveaux : Joueur, Admin, Super Admin, droits réglables par le Super Admin.']],['1.0','Version de base',['Matchs, convocations, compo, stats, collectes et dépenses, vote de l\'homme du match.']]];
function majPage(){const L=Object.values(C.log).sort((a,b)=>b.ts-a.ts).slice(0,80),A={ajout:'a ajouté',modif:'a modifié',suppr:'a supprimé'};
 return `<button onclick="T='opt';render()" style="margin:8px 0">← Options</button><h2>🔄 Mise à jour</h2><div class="mu">Touche une version pour voir ce qu'elle apporte.</div>${VERS.map(([v,t,d],i)=>`<details class="c" ${i==0?'open':''}><summary style="font-weight:600;cursor:pointer">v${v} · ${t}</summary><ul style="margin:8px 0 0 18px;padding:0">${d.map(x=>`<li>${x}</li>`).join('')}</ul></details>`).join('')}<div class="c"><b>👤 Activité récente</b><div class="mu">Qui a modifié ou ajouté quoi (depuis la v1.5).</div>${L.map(e=>`<div class="pl"><span><b>${esc(e.who)}</b> ${A[e.act]} ${CNM[e.c]||e.c}${e.lab?' « '+esc(e.lab)+' »':''}</span><span class="mu">${new Date(e.ts).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<div class="mu">Aucune activité pour l\'instant.</div>'}</div>`}
/* ===== v7 : présent/absent, reporté/annulé, nombre de joueurs ===== */
function setSt(id,s){const e=C.matches[id];put('matches',id,{...e,status:e.status==s?'':s})}
const badge=s=>`<span style="padding:4px 9px;border-radius:7px;font-size:.7rem;font-weight:700;color:#fff;background:${s=='rep'?'#f5c400':'#fb7d3c'}">${s=='rep'?'REPORTÉ':'ANNULÉ'}</span>`;

function openBanner(){if(lvl()<2)return;TMP={banner:(C.config.club||{}).banner||''};M='banner';render()}
function pickBanner(i){const f=i.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width,1300/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);TMP.banner=c.toDataURL('image/jpeg',.72);render()};im.src=r.result};r.readAsDataURL(f)}
function saveBanner(){const b=TMP.banner||'';M=null;const o={...(C.config.club||{}),id:'club'};if(b)o.banner=b;else delete o.banner;put('config','club',o)}

modal=function(){return M=='banner'?bannerModal():_md380()};

admPage=function(){let h=_ap380();
 if(lvl()<2)return h;
 const row=prow('🏷','Détails de l\'équipe',`T='tinfo';render();scrollTo(0,0)`);
 return h.replace(row,row+prow('🖼','Image de fond de l’accueil','openBanner()'))};
VERS.unshift(['3.80','Accueil : photo de fond et changement depuis l’Admin',['La bannière de l’Accueil utilise maintenant la photo de terrain au coucher du soleil (ballon, buts, ciel orangé) à la place du dessin.','Menu Admin › Club › « Image de fond de l’accueil » : choisir une autre photo depuis le téléphone ou l’ordinateur, voir l’aperçu, Enregistrer, ou revenir à « Image d’origine ». La photo est réduite automatiquement et partagée avec tous les membres.','Un léger dégradé sombre en haut de la bannière garde le nom du club lisible sur n’importe quelle photo.']]);
VERS.unshift(['3.81','Accueil : photo de fond vue de plus loin',['La bannière est plus haute (340 px au lieu de 290) et la photo est cadrée plus haut : plus de ciel, d’arbres et de buts visibles, ballon plus bas, comme sur la maquette.']]);
VERS.unshift(['3.82','Accueil : photo encore plus dézoomée',['La bannière a maintenant des proportions fixes (un peu plus haute que large) : le ballon apparaît presque entier, avec plus de ciel et de terrain, quelle que soit la largeur de l’écran.']]);
VERS.unshift(['3.83','Accueil : taille de la photo comme sur la maquette',['La photo est recadrée comme sur l’exemple : plus de ciel et d’horizon, le ballon est coupé en bas par la carte « Prochain match », et la proportion entre la photo et la carte est celle de la maquette.']]);
VERS.unshift(['3.84','Accueil : photo moins haute, proportion de la maquette',['La bannière est raccourcie (environ 0,74 fois la largeur de l’écran visible au-dessus de la carte, comme sur l’exemple) ; la carte « Prochain match » remonte donc plus haut dans l’écran, et le ballon reste coupé en bas par la carte.']]);
VERS.unshift(['3.85','Accueil : cartes remontées, photo vue de plus loin',['La bannière est encore raccourcie : les cartes « Prochain match » et « Dernier résultat » remontent d’environ 40 px.','La photo par défaut est élargie sur les côtés (ciel, arbres et terrain prolongés) : le ballon est vu de plus loin, environ un quart plus petit, et reste coupé en bas par la carte.']]);
</script>
<script>
/* ===== v3.86 : Accueil, tailles des infos comme la v3.78 + photo vue de plus loin ===== */
homePage=function(){
 const td=today(),cap=x=>x.charAt(0).toUpperCase()+x.slice(1),
 ok=m=>!solo(m)&&m.opp&&m.opp!='Pas de match'&&m.status!='ann',
 A=Object.values(C.matches).filter(ok),
 key=m=>(m.date||'')+(m.time||''),
 live=A.filter(m=>!played(m)&&!m.fin&&m.date==td).sort((a,b)=>key(a).localeCompare(key(b)))[0],
 next=live||A.filter(m=>!played(m)&&m.date>td).sort((a,b)=>key(a).localeCompare(key(b)))[0],
 last=A.filter(played).sort((a,b)=>key(b).localeCompare(key(a)))[0],
 club=C.config.club||{},
 bg=`url('${club.banner||HERO_IMG}')`,
 open=(m,t)=>`MID='${m.id}';MT='${t||'i'}';T='md';render();scrollTo(0,0)`,
 sides=m=>hm(m)?[[m.opp,0],[TEAM,1]]:[[TEAM,1],[m.opp,0]],
 G='#2f9e5e',
 hero=`<div style="position:relative;aspect-ratio:1/.83;max-height:460px;width:100%;border-radius:24px;overflow:hidden;color:#fff;background:#0d2417 ${bg} center ${club.banner?'31%':'0%'}/cover no-repeat"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,0) 48%)"></div><div style="position:absolute;left:16px;right:16px;top:18px;display:flex;align-items:center;gap:14px"><img src="${LOGO()}" alt="" style="width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none;background:#fff;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35)"><div style="min-width:0;text-shadow:0 2px 8px rgba(0,0,0,.55)"><div style="font-size:1.55rem;font-weight:800;line-height:1.15;overflow-wrap:anywhere">${esc(TEAM)}</div>${club.slogan?`<div style="font-size:.8rem;opacity:.95;margin-top:3px">${esc(club.slogan)}</div>`:''}</div></div></div>`,
 calIc=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
 team=([n,us])=>`<div style="flex:1;min-width:0;text-align:center"><div style="display:flex;justify-content:center">${clogo(n,us,64)}</div><div style="font-weight:700;margin-top:8px;overflow-wrap:anywhere;line-height:1.2">${esc(n)}</div></div>`;
 let nc;
 if(next){
  const m=next,sd=sides(m),tot=cv(m).length,cnt=cv(m).filter(p=>av(m.id,p.id)=='y').length,pc=tot?Math.round(cnt*100/tot):0,
  sme=ME?av(m.id,ME):null,when=[(m.time||'').replace(':','h'),m.place||(m.loc=='e'?'Extérieur':'')].filter(Boolean).join(' - ');
  let act='';
  if(EVS().pres&&!m.status){
   if(sme=='y')act=`<button onclick="presDlg('${m.id}','y')" style="width:100%;min-height:50px;border-radius:12px;border:0;background:${G};color:#fff;font-weight:700;font-size:1rem;box-shadow:none">✓ Je participe</button>`;
   else if(sme=='n')act=`<button onclick="presDlg('${m.id}','n')" style="width:100%;min-height:50px;border-radius:12px;border:0;background:#9ca3af;color:#fff;font-weight:700;font-size:1rem;box-shadow:none">Je ne participe pas</button>`;
   else act=`<button onclick="vote('${m.id}','y')" style="width:100%;min-height:50px;border-radius:12px;border:0;background:${G};color:#fff;font-weight:700;font-size:1rem;box-shadow:none">Je participe</button><button onclick="vote('${m.id}','n')" style="width:100%;min-height:38px;border-radius:12px;border:0;background:transparent;color:var(--mu);font-weight:600;margin-top:4px;box-shadow:none">Je ne peux pas</button>`}
  const dir=live&&typeof directOk=='function'&&directOk(m)?'d':'i';
  nc=`<div class="c" style="margin:-74px 0 12px;position:relative;padding:16px"><div style="display:flex;align-items:center;gap:8px;font-weight:700;color:${G};font-size:1.05rem">${live?'<span style="width:10px;height:10px;border-radius:50%;background:#e5483a;display:inline-block"></span>':calIc}${live?'Match en cours':'Prochain match'}</div><div class="mu" style="font-size:.88rem;margin-top:8px">${cap(D(m).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}</div>${when?`<div class="mu" style="font-size:.88rem">${esc(when)}</div>`:''}<div style="display:flex;align-items:center;gap:6px;margin:18px 0 16px">${team(sd[0])}<b style="font-size:1.1rem;flex:none">VS</b>${team(sd[1])}</div><div style="display:flex;align-items:center;gap:8px;font-size:.88rem;margin-bottom:6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="${G}"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3-6 7-6s7 2.4 7 6z"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14c3 0 5 1.8 5 4.5V20h-4"/></svg><span>${cnt} / ${tot} présents</span></div><div style="height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${pc}%;background:${G};border-radius:99px"></div></div>${act}<button onclick="${open(m,dir)}" style="width:100%;min-height:44px;border-radius:12px;border:0;background:var(--bd);color:var(--tx);font-weight:600;margin-top:8px;box-shadow:none">${live&&dir=='d'?'Voir le direct':'Voir la feuille de match'}</button></div>`}
 else nc=`<div class="c" style="margin:-74px 0 12px;position:relative;text-align:center"><div style="display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:${G}">${calIc}Prochain match</div><div class="mu" style="margin-top:10px">Aucun match à venir pour le moment.</div></div>`;
 let lc;
 if(last){
  const m=last,sd=sides(m),us=+m.us||0,th=+m.them||0,
  nm=([n,u])=>`<div style="flex:1;min-width:0;text-align:center"><div style="display:flex;justify-content:center">${clogo(n,u,44)}</div><div style="font-size:.8rem;margin-top:4px;overflow-wrap:anywhere;line-height:1.2">${esc(n)}</div></div>`,
  l=sd[0][1]?us:th,r=sd[1][1]?us:th;
  lc=`<div class="c" onclick="${open(m)}" style="cursor:pointer;padding:16px"><div style="display:flex;align-items:center;gap:8px;font-weight:700;color:${G};font-size:1.05rem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${G}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8.5 15l2.6 2.6 4.4-4.6"/></svg>Dernier résultat</div><div class="mu" style="font-size:.82rem;margin-top:6px">${cap(D(m).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}</div><div style="display:flex;align-items:center;gap:6px;margin-top:12px">${nm(sd[0])}<b style="flex:none;font-size:1.9rem;white-space:nowrap;padding:0 4px">${l} - ${r}</b>${nm(sd[1])}</div></div>`}
 else lc=`<div class="c mu" style="text-align:center">Aucun résultat pour le moment.</div>`;
 return hero+nc+lc};
VERS.unshift(['3.86','Accueil : proportions de la v3.78 et photo vue de plus loin',['Les cartes « Prochain match » et « Dernier résultat » reprennent les tailles de la v3.78 (marges, logos 64 et 44, textes, barre de présence, boutons) et sont de nouveau pleine largeur.','La photo par défaut est prolongée à gauche et à droite : le ballon est vu de plus loin (environ un tiers plus petit qu’avant) et presque entier au-dessus de la carte.']]);
</script>
</body>
</html>
