html{-webkit-text-size-adjust:100%}img,svg{max-width:100%}input,select,textarea{font-size:16px;max-width:100%}.c{overflow-wrap:anywhere}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.cnt{flex-wrap:wrap;justify-content:flex-end}.mb{width:min(520px,100%)}
.gate{min-height:calc(100dvh - 24px);display:flex;align-items:center;justify-content:center;padding:12px}.gc,.gc *{box-sizing:border-box}.gc{width:min(440px,100%);background:#141414;color:#fff;border:2px solid #f5c400;border-radius:22px;padding:26px 22px;text-align:center}.gc h1{color:#f5c400;font-size:clamp(1.5rem,7vw,2rem);margin:0 0 6px}.gc h2{color:#f5c400;font-size:1.1rem;margin:22px 0 12px}.gc input{width:100%;background:#2a2a2a;color:#fff;border:0;border-radius:10px;padding:14px;margin-bottom:12px}.gc .go{width:100%;background:#f5c400;color:#111;border:0;border-radius:10px;padding:14px;font-weight:800;letter-spacing:.03em}.gc small{color:#aaa;display:block;margin-top:14px}
@media(max-width:420px){.top .r>*{min-width:0}.top h1{font-size:1.1rem}.mc{padding:10px;gap:8px}}
@media(min-width:900px){.mb{width:560px}}
.rg{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;outline:none;padding:0;background:#e5e7eb;min-width:0}.rg::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #d1d5db;box-shadow:0 1px 4px #0003}.rg::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid #d1d5db;box-shadow:0 1px 4px #0003}.rg:disabled{opacity:.75}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
</style>

window.fbWarn=m=>{let e=document.getElementById('fberr');if(!e){e=document.createElement('div');e.id='fberr';e.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#b42318;color:#fff;padding:10px 14px;border-radius:10px;font:600 14px system-ui,sans-serif';document.body.appendChild(e)}e.textContent='⚠️ '+m};

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {initializeFirestore,doc,collection,setDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ====== CONFIG FIREBASE ======
   Remplace les 3 valeurs ci-dessous par celles de TON projet Firebase :
   Console Firebase > Paramètres du projet (roue dentée) > Général > Vos applications > Application Web > "Configuration du SDK".
   Cette clé web n'est pas secrète (elle est visible dans toute appli web Firebase). */
const firebaseConfig={
  apiKey:'AIzaSyCuc87kR9leefzOcSlyJ2am7G1eJRXKrew',
  authDomain:'flpc-eab14.firebaseapp.com',
  projectId:'flpc-eab14'
};
const PFX='';

try{
  if(!firebaseConfig.apiKey||/^VOTRE/.test(firebaseConfig.apiKey))throw {code:'config',message:'Firebase non configuré : le site fonctionne en mode local (voir le guide PDF, étape de configuration).'};
  const app=initializeApp(firebaseConfig);
  const store=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
  const clean=d=>JSON.parse(JSON.stringify(d));
  const fail=e=>{console.error('Firestore',e);if(e&&e.code==='permission-denied')fbWarn('Firestore refuse l\'accès (permission-denied) : vérifie les règles Firestore (voir le guide PDF).');else fbWarn('Firebase : '+((e&&e.code)||'erreur')+'. Vérifie ta connexion.')};
  // Interface utilisée par l'application : db.collection(c).doc(id).set/delete et db.collection(c).onSnapshot
  window.__fbOk({collection:c=>{const p=PFX+c;return{
    doc:id=>({set:d=>setDoc(doc(store,p,id),clean(d)),delete:()=>deleteDoc(doc(store,p,id))}),
    onSnapshot:(ok,err)=>onSnapshot(collection(store,p),s=>ok({docs:s.docs.map(x=>({id:x.id,data:()=>x.data()}))}),e=>{fail(e);err&&err(e)})}}});
}catch(e){console.error(e);fbWarn(e.message||'Firebase indisponible.');window.__fbOk(null)}

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const FORM={'4-4-2':[[50,92],[15,72],[38,74],[62,74],[85,72],[15,46],[38,50],[62,50],[85,46],[36,20],[64,20]],'4-3-3':[[50,92],[15,72],[38,74],[62,74],[85,72],[28,50],[50,54],[72,50],[20,22],[50,16],[80,22]],'3-5-2':[[50,92],[24,74],[50,76],[76,74],[10,48],[30,52],[50,44],[70,52],[90,48],[36,20],[64,20]]};
const IC='<svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-5 4-7.5 8.5-7.5s8.5 2.5 8.5 7.5z"/></svg>';
const DC={b:'⚽ Ballons',m:'👕 Maillots',a:'🧑‍⚖️ Arbitre',t:'🚌 Transport',o:'📦 Autre'};
let db=null,canAdm=true,ADM=false,T='cal',M=null,MD=null,TMP=null,COL=null,SEL=null,FIL='all',CF=null,ME=null,SEA='all',CT='col';
let C={players:{},matches:{},avail:{},pins:{},collectes:{},pay:{},votes:{},depenses:{},rides:{},roles:{},config:{},meals:{},teams:{},log:{},req:{},live:{}};
try{const l=JSON.parse(localStorage.getItem('foot_c')||'null');if(l)C={...C,...l};ME=localStorage.getItem('foot_me')||null}catch(e){}
const saveLocal=()=>{if(!db)try{localStorage.setItem('foot_c',JSON.stringify(C))}catch(e){}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
async function put(c,id,d){C[c][id]=d;saveLocal();render();if(db)try{await db.collection(c).doc(id).set(d)}catch(e){toast('Action non autorisée')}}
async function del(c,id){delete C[c][id];saveLocal();render();if(db)try{await db.collection(c).doc(id).delete()}catch(e){}}
function ask(msg,fn){CF=fn;M='cf';MD=msg;render()}
function togAdm(){if(!canAdm)return toast("Mode admin réservé à l'organisateur");ADM=!ADM;render()}
(async()=>{try{const d=await Promise.race([window.fbReady,new Promise(r=>setTimeout(()=>r(null),8000))]);
 if(d){db=d;canAdm=true;for(const c of Object.keys(C))db.collection(c).onSnapshot(s=>{C[c]={};s.docs.forEach(x=>C[c][x.id]=x.data());render()},()=>toast('Synchronisation indisponible'))}}catch(e){console.warn('Backend non chargé, mode local',e)}render()})();

const seas=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m>=8?y+'-'+(y+1):(y-1)+'-'+y};
const inS=d=>SEA=='all'||seas(d)==SEA;
const P=()=>Object.values(C.players).sort((a,b)=>a.name.localeCompare(b.name));
const nm=id=>(C.players[id]||{}).name||'?';
const ML=()=>Object.values(C.matches).filter(m=>inS(m.date)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const cv=m=>m.conv?P().filter(p=>m.conv.includes(p.id)):P();
const played=m=>typeof m.us==='number';
const res=m=>m.us>m.them?'V':m.us<m.them?'D':'N';
const sg=n=>(n>0?'+':'')+n,cl=n=>n>0?'pos':n<0?'neg':'';
const D=m=>new Date(m.date+'T12:00');
const today=()=>new Date().toISOString().slice(0,10);
const eur=n=>(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
const av=(m,p)=>(C.avail[m+'_'+p]||{}).s;
function setAv(m,p,s){s?put('avail',m+'_'+p,{m,p,s}):del('avail',m+'_'+p)}
function vote(m,s){const e=C.matches[m];if(!ME){toast("Connecte-toi d'abord");M='login';MD={pid:''};return render()}if(!cv(e).some(p=>p.id==ME))return toast("Tu n'es pas convoqué");setAv(m,ME,av(m,ME)==s?null:s)}
function cyc(m,p){const o=[undefined,'y','n','m'];setAv(m,p,o[(o.indexOf(av(m,p))+1)%4])}
function agg(l){const t={j:0,V:0,N:0,D:0,bp:0,bc:0};l.forEach(m=>{t.j++;t[res(m)]++;t.bp+=m.us;t.bc+=m.them});t.gd=t.bp-t.bc;return t}
function scorers(l){const r={};l.forEach(m=>Object.entries(m.st||{}).forEach(([i,s])=>{if(C.players[i]&&s.b)r[i]=(r[i]||0)+s.b}));return Object.entries(r).sort((a,b)=>b[1]-a[1]||nm(a[0]).localeCompare(nm(b[0])))}
function rank(l){const r={};P().forEach(p=>r[p.id]={n:p.name,m:0,b:0,d:0,v:0,c:0});
 l.forEach(m=>Object.entries(m.st||{}).forEach(([id,s])=>{const x=r[id];if(!x||!(s.pl||s.b||s.d||s.v||s.c))return;x.m++;x.b+=s.b||0;x.d+=s.d||0;x.v+=s.v?1:0;x.c+=s.c||0}));
 return Object.values(r).map(x=>({...x,pts:x.m*2+x.b*3+x.d*2+x.v*5})).sort((a,b)=>b.pts-a.pts||b.b-a.b)}
function opps(l){const o={};l.forEach(m=>{const k=(m.opp||'?').trim().toLowerCase();(o[k]=o[k]||{n:m.opp.trim(),l:[]}).l.push(m)});return Object.values(o).map(x=>({n:x.n,...agg(x.l)})).sort((a,b)=>b.j-a.j||b.gd-a.gd)}
function donut(t){const R=40,K=2*Math.PI*R;let o=0;return `<svg viewBox="0 0 100 100" width="120" height="120" style="transform:rotate(-90deg)">${t.j?[[t.V,'var(--ac)'],[t.N,'var(--or)'],[t.D,'var(--rd)']].map(([n,c])=>{if(!n)return'';const l=K*n/t.j,s=`<circle cx="50" cy="50" r="${R}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${l} ${K-l}" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join(''):`<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--bd)" stroke-width="16"/>`}</svg>`}
function evo(L){if(L.length<2)return'<div class="mu">Au moins 2 matchs joués pour voir la courbe.</div>';let g=0;const v=L.map(m=>g+=m.us-m.them),mn=Math.min(0,...v),mx=Math.max(0,...v),W=300,H=110,pd=12,x=i=>pd+i*(W-2*pd)/(v.length-1),y=n=>mx==mn?H/2:H-pd-(n-mn)*(H-2*pd)/(mx-mn);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${pd}" x2="${W-pd}" y1="${y(0)}" y2="${y(0)}" stroke="var(--bd)"/><polyline fill="none" stroke="#e8643c" stroke-width="3" points="${v.map((n,i)=>x(i)+','+y(n)).join(' ')}"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="4" fill="var(--tx)"/>`).join('')}</svg><div class="mu">Goal average cumulé : <b class="${cl(g)}">${sg(g)}</b></div>`}

const dblock=m=>{const d=D(m);return `<div class="db"><span>${d.toLocaleDateString('fr-FR',{weekday:'short'})}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString('fr-FR',{month:'short'})}</span>${m.time?`<small>${m.time}</small>`:''}</div>`};
const tag=m=>`<span class="tag ${m.mode=='c'?'c':'a'}">${tg(m)}</span>`;
const full=m=>D(m).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(m.time?' · '+m.time:'');
const ven=m=>m.place||m.loc=='e'?`<div class="ven">🏟 ${esc(m.place||'')}${m.loc=='e'?' · Extérieur':''}</div>`:'';

function presTab(m){const E=EVS();if(!E.pres)return '<div class="c mu">La gestion des présences est désactivée.</div>';let h=convCard(m);if(E.wait){const w=cv(m).filter(p=>av(m.id,p.id)=='w'),y=cv(m).filter(p=>av(m.id,p.id)=='y').length;h+=`<div class="c"><b>⏳ Liste d'attente</b>${can('conv')?`<div class="r" style="margin:8px 0"><input type="number" min="0" placeholder="Places max (0 = illimité)" value="${m.max||''}" onchange="put('matches','${m.id}',{...C.matches['${m.id}'],max:+this.value||0})"></div>`:''}<div class="mu">${m.max?y+'/'+m.max+' places prises':'Aucune limite de places'}</div>${w.map((p,i)=>`<div class="pl"><span>${i+1}. ${esc(p.name)}</span></div>`).join('')||'<div class="mu">Personne en attente.</div>'}</div>`}return h}
const _vote=vote;vote=function(m,s){const e=C.matches[m],E=EVS();if(s=='y'&&E.pres&&E.wait&&+e.max&&ME&&av(m,ME)!='y'&&cv(e).some(p=>p.id==ME)&&cv(e).filter(p=>av(m,p.id)=='y').length>=+e.max){setAv(m,ME,av(m,ME)=='w'?null:'w');return toast("Complet : tu es en liste d'attente")}return _vote(m,s)};

const wkEnd=()=>{const t=new Date(today()+'T12:00'),e=new Date(t);e.setDate(t.getDate()+(6-((t.getDay()+6)%7)));return e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0')};
const inWk=m=>!played(m)&&!m.status&&m.date>=today()&&m.date<=wkEnd();
function wkS(A,td){const adm=lvl()>=2,real=m=>adm||!(m.mode=='o'&&m.opp=='Pas de match'),we=wkEnd(),
 cur=A.filter(m=>real(m)&&!played(m)&&m.status!='ann'&&m.date>=td&&m.date<=we),
 nx=A.filter(m=>real(m)&&!played(m)&&m.date>we);
 return [['🔴 En cours',cur],['📅 À venir',adm?nx:nx.slice(0,1)],['✅ Terminés',A.filter(played).reverse().concat(A.filter(m=>!played(m)&&m.date<td))]]}
const _mr35=mright;mright=function(m,sz){return inWk(m)&&m.date>today()?'<span class="mu">🔴 En cours</span>':_mr35(m,sz)};
</script>
